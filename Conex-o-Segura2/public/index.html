<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conexão Segura — O Jogo</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="shop.css">
  <link rel="stylesheet" href="additions.css">
  <meta name="description" content="Conexão Segura: jogue, aprenda e troque suas moedas por recompensas na loja.">
</head>
<body>
  <main class="app-shell">

    <header class="site-header">
      <button class="wordmark" id="brandHome" aria-label="Voltar ao início">
        <span class="brand-mark">🫧</span>
        <span>CONEXÃO<br><strong>SEGURA</strong></span>
      </button>
      <div class="header-actions">
        <span class="header-wallet"><img src="assets/moeda.png" alt="Moedas"><strong id="walletBalance">0</strong></span>
        <button class="icon-btn" id="backBtn" title="Voltar ao início" hidden>←</button>
        <button class="icon-btn" id="soundBtn" title="Ativar/desativar som">🔊</button>
        <button class="icon-btn" id="musicBtn" title="Silenciar música de fundo" aria-label="Silenciar música de fundo" aria-pressed="true">♫</button>
        <div class="volume-wrap">
          <button class="icon-btn" id="volumeBtn" title="Ajustar volume da música" aria-label="Ajustar volume da música" aria-expanded="false">🎚️</button>
          <div class="volume-popover" id="volumePopover" hidden>
            <label for="volumeSlider">VOLUME DA MÚSICA</label>
            <div class="volume-row">
              <span aria-hidden="true">🔈</span>
              <input type="range" id="volumeSlider" min="0" max="100" step="1" value="50" aria-label="Volume da música">
              <span aria-hidden="true">🔊</span>
            </div>
            <output id="volumeValue" for="volumeSlider">50%</output>
          </div>
        </div>
        <button class="icon-btn" id="narrateBtn" title="Ativar/desativar narração">🗣️</button>
      </div>
    </header>

    <div id="app"></div>

    <footer class="site-footer">
      <span>CONEXÃO SEGURA © 2026</span>
      <span>JOGUE, APRENDA, PROTEJA-SE ✦</span>
    </footer>
  </main>

  <div id="playerModal" class="modal-backdrop hidden">
    <div class="player-setup">
      <button class="icon-btn modal-close" id="closeModal">×</button>
      <span class="eyebrow">PREPARE-SE PARA JOGAR</span>
      <h2>Quem vai <em>jogar?</em></h2>
      <p>Escolha seu personagem e o nome que vai aparecer na partida.</p>

      <form id="playerForm">
        <fieldset>
          <legend>SEU AVATAR</legend>
          <div class="avatar-grid" id="avatarGrid"></div>
        </fieldset>

        <label for="nickname">SEU NICKNAME</label>
        <input id="nickname" maxlength="20" minlength="2" placeholder="Como podemos te chamar?" autocomplete="off" required>
        <div id="nameError" class="setup-error"></div>

        <button class="game-btn full" type="submit">VAMOS JOGAR →</button>
      </form>
    </div>
  </div>

  <script src="database.js"></script>
  <script src="shop.js"></script>
  <script src="memory.js"></script>
  <script src="script.js"></script>
  <script src="music.js"></script>
</body>
</html>
